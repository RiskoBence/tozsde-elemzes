name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Adatfrissítés 15 percenként a kereskedési ablak körül (UTC; nyári és téli időszámítást is lefedi).
  # A GitHub ütemezése 5–15 percet késhet.
  schedule:
    - cron: '*/15 13-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: NQ=F adat letöltése (Yahoo Finance)
        id: adat
        continue-on-error: true
        run: node scripts/adat.mjs

      - name: Adat mentése a repóba (archívum + az ágensnek)
        if: steps.adat.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/adat
          if git diff --cached --quiet; then echo "Nincs változás."; exit 0; fi
          git commit -q -m "adat: NQ=F $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          echo "::warning::Az adat-commitot nem sikerült pusholni (a deploy ettől még lefut)."

      - name: Tesztek
        run: npm test

      - name: Build
        run: npm run build
        env:
          # A repo nevéből automatikusan: /tozsde-elemzes (saját domainnél üres → '/')
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          TZ: Europe/Budapest

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
