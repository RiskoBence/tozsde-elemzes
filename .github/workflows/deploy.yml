name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Tesztek
        run: npm test

      - name: Build
        run: npm run build
        env:
          # A repo nevéből automatikusan: /tozsde-elemzes (saját domainnél üres → '/')
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          TZ: Europe/Budapest

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
